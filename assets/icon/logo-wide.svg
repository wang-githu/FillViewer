<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360" role="img" aria-label="FillViewer">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16273a"/>
      <stop offset="0.55" stop-color="#0d1620"/>
      <stop offset="1" stop-color="#080d13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22374d"/>
      <stop offset="1" stop-color="#0a121a"/>
    </linearGradient>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ae4ff"/>
      <stop offset="0.45" stop-color="#3d97ff"/>
      <stop offset="1" stop-color="#1c5fd0"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfdcff"/>
    </linearGradient>
    <clipPath id="lb">
      <rect x="86" y="86" width="90" height="124" rx="17"/>
    </clipPath>
  </defs>

  <!-- 深色圆角面板（浅色/深色主题下都清晰） -->
  <rect x="0" y="0" width="1400" height="360" rx="34" fill="url(#panel)"/>
  <rect x="0" y="0" width="1400" height="360" rx="34" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1397" height="357" rx="32.5" fill="none"
        stroke="#26405a" stroke-opacity="0.9" stroke-width="3"/>

  <!-- mark -->
  <rect x="52" y="62" width="236" height="236" rx="56" fill="url(#tile)"/>
  <rect x="86" y="86" width="90" height="124" rx="17" fill="#132131"/>
  <g clip-path="url(#lb)">
    <path d="M86 142 q11.25 -7.5 22.5 0 t22.5 0 t22.5 0 t22.5 0 V210 H86 Z" fill="url(#liq)"/>
  </g>
  <rect x="86" y="86" width="90" height="124" rx="17" fill="none" stroke="#dbe8f6" stroke-width="9.5"/>
  <ellipse cx="131" cy="86" rx="41" ry="11.5" fill="#080f16"/>
  <ellipse cx="131" cy="86" rx="41" ry="11.5" fill="none" stroke="#dbe8f6" stroke-width="9.5"/>
  <circle cx="188" cy="122" r="8" fill="#8ae4ff"/>
  <circle cx="205" cy="157" r="4.5" fill="#3d97ff"/>

  <!-- wordmark -->
  <text x="336" y="196" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="1.5" fill="url(#txt)">FillViewer</text>
  <text x="339" y="248" font-family="Segoe UI, Microsoft YaHei, Helvetica, Arial, sans-serif"
        font-size="29" font-weight="500" letter-spacing="3.4" fill="#7fa6c9">WINCC · 3D HMI · IN THE BROWSER</text>
</svg>
