<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FillViewer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#22374d"/>
      <stop offset="0.6" stop-color="#111c27"/>
      <stop offset="1" stop-color="#070c11"/>
    </linearGradient>
    <linearGradient id="fliq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ae4ff"/>
      <stop offset="0.5" stop-color="#3d97ff"/>
      <stop offset="1" stop-color="#1a55c0"/>
    </linearGradient>
    <clipPath id="fbody">
      <rect x="138" y="112" width="236" height="288" rx="40"/>
    </clipPath>
  </defs>

  <!-- 铺满画布的圆角底板（16px 下更饱满） -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#fbg)"/>

  <!-- 罐体：宽描边、无顶口细节，16px 也认得出 -->
  <rect x="138" y="112" width="236" height="288" rx="40" fill="#0a1219"/>
  <g clip-path="url(#fbody)">
    <path d="M138 262 q29.5 -22 59 0 t59 0 t59 0 t59 0 V400 H138 Z" fill="url(#fliq)"/>
  </g>
  <rect x="138" y="112" width="236" height="288" rx="40" fill="none"
        stroke="#eef5fc" stroke-width="42"/>
</svg>
